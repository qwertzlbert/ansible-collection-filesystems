---
- name: Create a volume group
  community.general.lvg:
    vg: "{{ _vg_name }}"
    pvs: "{{ _vg_drives | join(',') }}"
    pesize: "{{ pe_config.pesize }}"
    pvresize: "{{ pe_config.pvresize }}"
    pv_options: "{{ pe_config.pv_options | default(omit) }}"

- name: Create logical volumes
  community.general.lvol:
    vg: "{{ _vg_name }}"
    lv: "{{ _lvol_item.key }}"
    size: "{{ _lvol_item.value.size }}"
    opts: "{{ _lvol_item.value.opts | default(omit) }}"
    resizefs: "{{ _lvol_item.value.resizefs | default(omit) }}"
    shrink: false
  loop: "{{ _vg_logical_volumes | dict2items }}"
  loop_control:
    loop_var: _lvol_item
    label: "{{ _lvol_item.key }}"

- name: Create thin pools and thin volumes
  ansible.builtin.include_tasks: _thin_pool.yml
  loop: "{{ _vg_thin_pools | dict2items }}"
  loop_control:
    loop_var: _pool_item
    label: "{{ _vg_name }}/{{ _pool_item.key }}"
