---
# NOTE(cloudnull): This task file will run checks to see if the target RAID array exists.
#                  These checks are done to ensure we're not damaging data and the role
#                  remains idempotent.

- name: Check status of array
  ansible.builtin.command: >-
    grep "^{{ outer_item.key }} :" /proc/mdstat
  register: "array_check"
  changed_when: false
  failed_when: false
  check_mode: false

- name: Check array config
  ansible.builtin.command: >-
    grep "^ARRAY.*{{ outer_item.key }}\b" {{ mdadm_conf_path }}
  register: "config_check"
  changed_when: false
  failed_when: false
  check_mode: false

- name: Create array block
  become: true
  when:
  - array_check.rc != 0
  - config_check.rc != 0
  vars:
    _force: "{{ outer_item.value.force | default(mdadm_default_force) | bool }}"
    _level: "{{ 'raid' ~ ((outer_item.value.level | string | lower) | regex_replace('^raid', '')) }}"
    _bitmap: >-
      {{ outer_item.value.bitmap | default('internal' if _level in ['raid1', 'raid5', 'raid6'] else 'none') }}
    _argv: >-
      {{
        ['mdadm', '--create', '/dev/' ~ outer_item.key,
         '--run',
         '--level=' ~ (_level | regex_replace('^raid', '')),
         '--raid-devices=' ~ (outer_item.value.drives | count),
         '--metadata=' ~ (outer_item.value.metadata | default(mdadm_default_metadata))]
        + (['--chunk=' ~ (outer_item.value.chunk | default(mdadm_default_chunk))] if _level != 'raid1' else [])
        + (['--bitmap=' ~ _bitmap] if (_bitmap | string) != 'none' else [])
        + (['--assume-clean'] if (outer_item.value.assume_clean | default(mdadm_default_assume_clean) | bool) else [])
        + (['--name=' ~ outer_item.value.name] if outer_item.value.name is defined else [])
        + (outer_item.value.drives | list)
      }}
  block:
  # NOTE: --run answers mdadm's "Continue creating array?" prompt (which also fires for
  #       raid1 with 1.x metadata), so the checks below are the safety gate instead.
  - name: Look for existing md superblocks on members
    ansible.builtin.command: "mdadm --examine {{ item }}"
    loop: "{{ outer_item.value.drives }}"
    register: _mdadm_examine
    changed_when: false
    failed_when: false
    check_mode: false

  - name: Look for existing filesystem, LVM or partition signatures on members
    ansible.builtin.command: "wipefs --noheadings --output TYPE {{ item }}"
    loop: "{{ outer_item.value.drives }}"
    register: _mdadm_wipefs
    changed_when: false
    check_mode: false

  - name: Refuse to overwrite existing data
    ansible.builtin.assert:
      quiet: true
      that:
      - _force or (_dirty | length == 0)
      fail_msg: >-
        Refusing to create {{ outer_item.key }}, these members already carry data or metadata:
        {{ _dirty | join(', ') }}. Set force: true on the array to overwrite them.
    vars:
      _dirty: >-
        {{
          (_mdadm_examine.results | selectattr('rc', 'eq', 0) | map(attribute='item') | list
           + _mdadm_wipefs.results | selectattr('stdout_lines') | map(attribute='item') | list)
          | unique
        }}

  - name: Creating array
    ansible.builtin.command:
      argv: "{{ _argv }}"
      creates: "/dev/{{ outer_item.key }}"
    register: "array_created"
    notify: Update initramfs
